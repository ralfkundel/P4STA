{% load static %}
	<script type="text/javascript">
		$(document).ready(function(){
			{% if dev_is_running == True %}getPorts();{% endif %}
			getIfaceStatus();

			$("#deploy").click(function() {
				$("#output_deploy").html('<img src="{% static 'images/spinner.svg' %}" width="50" height="50" />');
				$.get("/subpage_deploy_deploy_device/", function(data) {
					$("#output_deploy").html(data);
					getPorts();
				}, "html");
			});

			$("#start_stamper_software").click(function() {
				$("#output_start").html('<p>Starting stamper software ...</p><img src="{% static 'images/spinner.svg' %}" width="50" height="50" />');
				$.get("/subpage_deploy_start_stamper_software/", function(data) {
					$("#output_start").html(data);
					if (data.search("modal_timeout") == -1){
						location.reload();
					}
				}, "html");
			});

			$("#reboot").click(function() {
				$.get("/subpage_deploy_reboot/", function(data) {
					$("#output_reboot").html(data);
				}, "html");
			});
 
			$("#refresh_links").click(function() {
				$.get("/subpage_deploy_refresh_links/", function(data) {
					getIfaceStatus();
				}, "html");
			});

			$("#log").click(function() {
				$.get("/subpage_deploy_get_stamper_startup_log/", function(data) {
					$("#output_log").html(data);
				}, "html");
			});
		});

		function getPorts() {
		$("#output_ports").html('<p>Retrieving port status ...</p><img src="{% static 'images/spinner.svg' %}" width="50" height="50" />');
			$.get("/subpage_deploy_show_ports/", function(data) {
				$("#output_ports").html(data);
			}, "html");
		}

		function getIfaceStatus() {
		$("#output_iface_status").html('<p>Retrieving interface status ...</p><img src="{% static 'images/spinner.svg' %}" width="50" height="50" />');
			$.get("/subpage_deploy_host_iface_status/", function(data) {
				$("#output_iface_status").html(data);
			}, "html");
		}
	</script>


<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="fas fa-tachometer-alt text-muted mr-2"></i>Stamper Status</span>
    {% if dev_is_running %}
      <span class="badge badge-success px-3 py-2">Running</span>
    {% else %}
      <span class="badge badge-danger px-3 py-2">Stopped</span>
    {% endif %}
  </div>

  <div class="card-body">
    <p class="mb-3">P4STA configured P4 program: <strong>{{ cfg.program }}</strong></p>

    <div class="alert {% if dev_is_running %}alert-success{% else %}alert-danger{% endif %} d-flex justify-content-between align-items-center mb-3" role="alert">
      <div><strong>Stamper operational state:</strong> {{ dev_status }}</div>

      {% if dev_is_running %}
        <button id="log" type="button" class="btn btn-outline-secondary btn-sm ml-3" data-toggle="tooltip" data-placement="top" title="Show Stamper startup log." aria-label="Show Stamper startup log">
          <i class="fas fa-info-circle"></i>
        </button>
      {% endif %}
    </div>

    {% if dev_is_running %}
      <div class="mb-3">
        <button id="deploy" type="button" class="save btn btn-primary"><i class="fas fa-upload mr-1"></i>Deploy to Stamper</button>
      </div>

      <div id="output_log" class="mb-3"></div>
      <div id="output_deploy" class="mb-3"></div>

      <hr>
      <div id="output_ports"></div>
    {% else %}
      <button id="start_stamper_software" type="button" class="save btn btn-success mb-3"><i class="far fa-play-circle mr-1"></i>Start Stamper</button>
      <div id="output_start"></div>
    {% endif %}
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-header">
    <i class="fas fa-network-wired text-muted mr-2"></i>Interface Status
  </div>
  <div class="card-body">
    <div id="output_iface_status"></div>
  </div>
</div>
